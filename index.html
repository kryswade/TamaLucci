<script>
/* ===== TamaLucci – sprite generator =====
   Pixel art "chunky": contorno nero spesso, colori piatti a due toni, testa grande (derivato dal riferimento).
   Forme: baby, child, teen, adult  +  percorso negativo: bully (teen), thug e crim (adulti).
   Camminata: testa di tre quarti rimappata dal frontale. Fantasma: sagoma del pet con coda ondulata.        */
const PAL = {
  K: '#0c0b10', H: '#262629', S: '#f0c09c', s: '#bd8d79', D: '#5f4a45',
  W: '#e4f0fa', w: '#b4c0c9', B: '#601830', b: '#3c1824', m: '#7a4860', G: '#a9a9ae',
  Y: '#f7c92b', y: '#c99a14', U: '#2b62c4', u: '#1b3f8a', N: '#16306a', R: '#d8383a', r: '#9e2428',
  P: '#f59a9a', T: '#58b8f0', M: '#6a1626', J: '#4a74bd', j: '#2f528f', O: '#e8a23a', E: '#8a5a34', X: '#ffffff',
  L: '#3a3a44', l: '#55555f'
};
const SICK = { S: '#a8d08a', s: '#86b06a' };
const C = PAL;
const BAD = { bully: 1, thug: 1, crim: 1 };
const XE = { smile: 'smirk', normal: 'angry', happy: 'evil' };
const xe = (k, e) => (BAD[k] && XE[e]) || e;

function blank(w, h) { const g = []; for (let y = 0; y < h; y++) g.push(new Array(w).fill('.')); return g; }
const cl = g => g.map(r => r.slice());
function setc(g, x, y, c) { if (y >= 0 && y < g.length && x >= 0 && x < g[0].length) g[y][x] = c; }
function rectc(g, x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) setc(g, x + i, y + j, c); }
function stampc(dst, src, ox, oy) { for (let j = 0; j < src.length; j++) for (let i = 0; i < src[j].length; i++) if (src[j][i] !== '.') setc(dst, ox + i, oy + j, src[j][i]); }
function toSprite(g, sick) {
  const h = g.length, w = g[0].length, g2 = [];
  for (let y = 0; y < h; y++) { const row = []; for (let x = 0; x < w; x++) { const c = g[y][x]; row.push(c === '.' ? null : (sick && SICK[c]) || PAL[c] || null); } g2.push(row); }
  return { w, h, g: g2 };
}
function addOutline(g) {
  const h = g.length, w = g[0].length, o = blank(w + 2, h + 2);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) o[y + 1][x + 1] = g[y][x];
  const r = cl(o);
  for (let y = 0; y < o.length; y++) for (let x = 0; x < o[0].length; x++) {
    if (o[y][x] !== '.') continue;
    if ((y > 0 && o[y - 1][x] !== '.') || (y < o.length - 1 && o[y + 1][x] !== '.') || (x > 0 && o[y][x - 1] !== '.') || (x < o[0].length - 1 && o[y][x + 1] !== '.')) r[y][x] = 'K';
  }
  return r;
}
function trimBottom(g) { const r = cl(g); while (r.length > 1 && r[r.length - 1].every(c => c === '.')) r.pop(); return r; }

/* ================= ADULTO (riferimento 33x62) ================= */
const ADULT_ROWS = [
'............KKK...KKKKKKKK.......',
'..........KKHHHKKKHHHHHHHHKK.....',
'.........KHHHHHHKHHHHHHHHHHHK....',
'........KHHHHHHHHHHHHHHHHHHHHK...',
'.......KHHHHHHHHHHHHHHHHHHHHHHK..',
'.......KHHHHHHHHHHHHHHHHHHHHHHK..',
'......KHHHHHHHHHHHHHHHHHHHHHHHHK.',
'......KHHHHHHHHHHHHHHHHHHHHHHHHK.',
'.....KHHHHHHHHHHHKHHHHHHKHHKHHHHK',
'.....KHHHHHHHHHKKHHHHHKKKHHKHHHHK',
'......KHHHHHHHKKHHHHKKssKHKHHHHHK',
'......KHHHHHHKHKKKKKKsSKKKKHHHHHK',
'.....KHHHHHKKKKssssssSSSSSKHHHHHK',
'.....KHHHHHKssssSSSSSSSSSSsKHHHHK',
'.....KHHHHKsHHHHHSSSSHHHHHsKHHHHK',
'......KKHHKsSSsssHSSHsssSSsKHHHK.',
'.......KHKKSSKKKKSKSSKKKKSSKKKHK.',
'.......KKSKSSWKKWSKSSWKKWSSKSKHK.',
'........KSKSSSSSSSKSSSSSSSSKSKK..',
'.........KKSSSSSSSKSSSSSSSSKSK...',
'.........KKHSSSSSHSSSSSSSSHKK....',
'..........KHSSSSSsKKsSSSSSHKK....',
'...........KHSSSSSSSSSSSSHHK.....',
'...........KHSSHHHHSHHHSSHHK.....',
'...........KHHSHSSSSSSHHSHHK.....',
'...........KHHHHSKKKKKSHHHK......',
'............KHHHSSSSSSSHHKK......',
'......KKK...KKHHSSHHHSHHHK.......',
'.....KSSK....KKHHSSHSHHHK........',
'.....KSSK.....KKHHHHHHHK.........',
'.....KsSK......KKHHHHHKK.........',
'..KKKKKKSK....KKWKKKKKWKK........',
'.KSSSSSsKSK..KWKWWKKKWWKWK.......',
'KSSSSSSsKSKKKWWKWKBmBKWKWWK......',
'KSSSKKKKKsKWKWWWKwKBKwKWWWWKK....',
'KKSSSSSsKsKWWWWWWwKKKwWWWWWWWK...',
'.KSSSSssKsKWWwKWWWKBKWWWKKwWWWK..',
'.KSSSKKKKsKwKKKWWKBBBKWWK.KwWWWK.',
'..KKSSSSsKKK..KWWKBmBKWWK..KKKWWK',
'...KSSSssK....KWWKmBBKWWK..KWWWWK',
'....KKKKK.....KWWKBmBKWKKKKSGWWK.',
'..............KWWKmBBKKSSKGGSGK..',
'..............KWWKBBmKKKSSWWSK...',
'..............KWWKmBBKSSSSGGK....',
'..............KWWWKBKKSSSSSK.....',
'..............KwWWWKWwKSSSK......',
'..............KKKKKKKKKKKK.......',
'..............KbbBBbBBbbK........',
'..............KbBBBbBBBbK........',
'..............KBBBbKbBBBK........',
'..............KBBbK.KbBBK........',
'..............KBBbK.KbBBK........',
'..............KBBbK.KbBBK........',
'..............KBBbK.KbBBK........',
'..............KBBbK.KbBBK........',
'..............KBBK...KBBK........',
'..............KBBK...KBBK........',
'..............KBBK...KBBK........',
'..............KBBK...KBBK........',
'..............KBBK...KBBK........',
'..............KBBK...KBBK........',
'.............KKKKK...KKKKK.......'
];
const A0 = ADULT_ROWS.map(r => r.split(''));
const FIST = []; for (let y = 27; y <= 40; y++) FIST.push(A0[y].slice(0, 11));
const ABODY = cl(A0); for (let y = 27; y <= 40; y++) for (let x = 0; x <= 10; x++) ABODY[y][x] = '.';

/* espressioni (occhi riga 17/18, bocca riga `my`). Nuove: angry / smirk / evil (forme cattive) */
function face(g, expr, my) {
  const set = (x, y, c) => setc(g, x, y, c);
  const L = [13, 14, 15, 16], Rr = [21, 22, 23, 24];
  if (expr === 'blink' || expr === 'sleep' || expr === 'refuse' || expr === 'yawn') {
    for (const x of L.concat(Rr)) { set(x, 17, 's'); set(x, 18, 'K'); }
  } else if (expr === 'happy' || expr === 'grin') {
    for (const e of [L, Rr]) { set(e[0], 17, 'S'); set(e[1], 17, 'K'); set(e[2], 17, 'K'); set(e[3], 17, 'S'); set(e[0], 18, 'K'); set(e[3], 18, 'K'); }
  } else if (expr === 'sad') {
    set(16, 15, 'K'); set(21, 15, 'K'); set(13, 16, 'S'); set(24, 16, 'S'); set(13, 15, 'K'); set(24, 15, 'K');
    set(13, 18, 'T'); set(13, 19, 'T'); set(24, 18, 'T'); set(24, 19, 'T');
  } else if (expr === 'angry' || expr === 'smirk' || expr === 'evil') {
    for (const x of L.concat(Rr)) { set(x, 16, 'S'); set(x, 17, 'K'); }
    set(13, 17, 'S'); set(24, 17, 'S'); set(16, 17, 'W'); set(21, 17, 'W');
    set(13, 15, 'K'); set(14, 15, 'K'); set(15, 16, 'K'); set(16, 16, 'K'); set(24, 15, 'K'); set(23, 15, 'K'); set(22, 16, 'K'); set(21, 16, 'K');
  }
  switch (expr) {
    case 'smile': set(16, my - 1, 'K'); set(22, my - 1, 'K'); break;
    case 'happy': case 'grin':
      set(16, my - 1, 'K'); set(22, my - 1, 'K');
      set(17, my, 'K'); set(18, my, 'X'); set(19, my, 'X'); set(20, my, 'X'); set(21, my, 'K');
      for (let x = 17; x <= 21; x++) set(x, my + 1, 'K'); break;
    case 'sad': case 'refuse': set(16, my + 1, 'K'); set(22, my + 1, 'K'); break;
    case 'talk':
      set(17, my, 'K'); set(18, my, 'M'); set(19, my, 'M'); set(20, my, 'M'); set(21, my, 'K');
      for (let x = 17; x <= 21; x++) set(x, my + 1, 'K'); break;
    case 'eat': case 'yawn':
      for (let y = 0; y < 2; y++) { set(17, my + y, 'K'); set(18, my + y, 'M'); set(19, my + y, 'M'); set(20, my + y, 'M'); set(21, my + y, 'K'); }
      for (let x = 17; x <= 21; x++) set(x, my + 2, 'K'); break;
    case 'angry': for (let x = 17; x <= 21; x++) set(x, my, 'K'); set(16, my + 1, 'K'); set(22, my + 1, 'K'); break;
    case 'smirk': for (let x = 17; x <= 21; x++) set(x, my, 'K'); set(22, my - 1, 'K'); set(23, my - 2, 'K'); break;
    case 'evil':
      for (let x = 16; x <= 22; x++) set(x, my, 'K'); for (let x = 17; x <= 21; x++) { set(x, my + 1, 'X'); set(x, my + 2, 'K'); } set(16, my + 1, 'K'); set(22, my + 1, 'K'); break;
  }
}
function armDown(g) {
  for (let y = 33; y <= 44; y++) {
    setc(g, 10, y, y >= 34 ? 'K' : '.');
    if (y >= 34) { setc(g, 11, y, 'W'); setc(g, 12, y, 'W'); setc(g, 13, y, 'w'); }
  }
  setc(g, 10, 45, 'K'); setc(g, 11, 45, 'w'); setc(g, 12, 45, 'w'); setc(g, 13, 45, 'w');
  for (let y = 46; y <= 48; y++) { setc(g, 10, y, 'K'); setc(g, 11, y, 'S'); setc(g, 12, y, 'S'); setc(g, 13, y, 's'); }
  setc(g, 11, 49, 'K'); setc(g, 12, 49, 'K'); setc(g, 13, 49, 'K'); setc(g, 10, 49, 'K');
  setc(g, 11, 47, 'K');
}

/* ---- decorazioni delle forme cattive (testa: righe 0..28 identiche per teen e adult) ---- */
function decorHead(g, kind, expr) {
  const set = (x, y, c) => setc(g, x, y, c), closed = ['blink', 'sleep', 'refuse', 'yawn'].includes(expr);
  if (kind === 'bully') {
    [[14, 19], [13, 20], [14, 20], [15, 20], [14, 21]].forEach(p => set(p[0], p[1], 'X')); set(15, 21, 'w'); set(13, 19, 's');   // cerotto a croce
    set(9, 18, 'Y');                                                                                                         // orecchino
  } else if (kind === 'thug') {
    for (let y = 9; y <= 10; y++) for (let x = 6; x <= 31; x++) if (g[y][x] !== '.') set(x, y, y === 9 ? 'R' : 'r');          // bandana rossa
    for (let y = 10; y <= 13; y++) { set(3, y, 'K'); set(4, y, 'R'); set(5, y, y > 11 ? 'r' : 'R'); } set(3, 14, 'K'); set(4, 14, 'K'); set(5, 14, 'K');
    for (let y = 16; y <= 18; y++) { for (let x = 12; x <= 17; x++) set(x, y, 'K'); for (let x = 20; x <= 25; x++) set(x, y, 'K'); }   // occhiali scuri
    set(18, 17, 'K'); set(19, 17, 'K'); set(13, 17, 'G'); set(21, 17, 'G'); set(14, 16, 'l'); set(22, 16, 'l');
    if (expr === 'sad') { set(13, 19, 'T'); set(13, 20, 'T'); set(24, 19, 'T'); set(24, 20, 'T'); }
  } else if (kind === 'crim') {
    /* capelli intatti (nessuna cuffia): solo una cicatrice sulla guancia sinistra e un sopracciglio spezzato */
    [[13, 19], [14, 20], [14, 21], [15, 22]].forEach(p => set(p[0], p[1], 'D'));            // cicatrice diagonale
    set(13, 20, 'w'); set(15, 21, 'w');                                                       // punti di sutura
    if (!closed) set(14, 15, 'S');                                                            // sopracciglio interrotto
    if (expr === 'sad') { set(13, 19, 'T'); set(13, 20, 'T'); set(24, 19, 'T'); set(24, 20, 'T'); }
  }
}
function decorBody(g, kind, base) {
  const map = (m, y0, y1) => { for (let y = y0; y <= y1 && y < g.length; y++) for (let x = 0; x < g[y].length; x++) { const c = g[y][x]; if (m[c]) g[y][x] = m[c]; } };
  if (kind === 'bully') { map({ U: 'r', u: 'b', J: 'N', j: 'u' }, 30, g.length - 1); for (let x = 14; x <= 22; x++) if (g[38][x] === 'Y') g[38][x] = 'W'; }
  else if (kind === 'thug') {
    map({ W: 'L', w: 'H', B: 'R', m: 'r', b: 'r' }, 31, 46); map({ B: 'N', m: 'u', b: 'u' }, 47, g.length - 1);
    for (let y = 31; y <= 35; y++) for (let x = 15 + (y - 31); x <= 22 - (y - 31); x++) setc(g, x, y, x > 19 ? 'r' : 'R');
    [[14, 31], [23, 31], [15, 32], [22, 32], [16, 33], [21, 33], [17, 34], [20, 34], [18, 35], [19, 35]].forEach(p => setc(g, p[0], p[1], 'Y'));
    [[18, 36], [19, 36], [18, 37], [19, 37]].forEach(p => setc(g, p[0], p[1], p[0] === 19 ? 'y' : 'Y'));
    [[12, 33], [26, 33], [12, 38], [26, 38]].forEach(p => setc(g, p[0], p[1], 'G'));
  } else if (kind === 'crim') {                                  // tuta arancione da carcerato
    for (let y = 31; y <= 46; y++) for (let x = 0; x < g[y].length; x++) { const c = g[y][x]; if (c === 'W') g[y][x] = 'O'; else if (c === 'w' || c === 'B' || c === 'm' || c === 'b') g[y][x] = 'y'; }
    map({ B: 'O', m: 'y', b: 'y' }, 47, g.length - 1);
    for (let y = 33; y <= 41; y++) for (let x = 14; x <= 24; x++) setc(g, x, y, (y === 33 || y === 41 || x === 14 || x === 24) ? 'K' : 'X');   // targhetta col numero
    const dig = (x0, rows) => rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '1') setc(g, x0 + i, 35 + j, 'K'); }));
    dig(16, ['010', '110', '010', '010', '111']);        // 1
    dig(20, ['110', '001', '010', '001', '110']);        // 3
  }
}
function adultGrid(o, kind) {
  const g = cl(ABODY), e = xe(kind, o.expr);
  face(g, e, 25);
  if (o.pose === 'up') stampc(g, FIST, 0, 27); else armDown(g);
  if (kind) { decorHead(g, kind, e); decorBody(g, kind, 'adult'); }
  return g;
}
function adultSprite(o) { return toSprite(adultGrid(o), o.sick); }

/* ================= RAGAZZO: stessa faccia dell'adulto, senza barba, mento rotondo ================= */
function teenGrid(o, kind) {
  const a = cl(ABODY), rows = [], e = xe(kind, o.expr);
  for (let y = 0; y <= 22; y++) {
    const r = a[y].slice();
    if (y >= 20) for (let x = 11; x <= 26; x++) if (r[x] === 'H') r[x] = (x === 17 ? 's' : 'S');
    rows.push(r);
  }
  const W = 33;
  const chinRow = (L, R) => { const r = new Array(W).fill('.'); r[L] = 'K'; r[R] = 'K'; for (let x = L + 1; x < R; x++) r[x] = 'S'; r[R - 1] = 's'; return r; };
  rows.push(chinRow(12, 26)); rows.push(chinRow(13, 25)); rows.push(chinRow(14, 24)); rows.push(chinRow(15, 23));
  const bot = new Array(W).fill('.'); for (let x = 16; x <= 22; x++) bot[x] = 'K'; rows.push(bot);
  const neck = n => { const r = new Array(W).fill('.'); r[16] = 'K'; r[22] = 'K'; for (let x = 17; x <= 21; x++) r[x] = n; return r; };
  rows.push(neck('s')); rows.push(neck('S'));
  const body = cl(ABODY); if (o.pose === 'down') armDown(body);
  const del = new Set([41, 42, 43]);
  for (let y = 31; y <= 61; y++) {
    if (del.has(y)) continue;
    const r = body[y].slice();
    for (let x = 0; x < r.length; x++) {
      const c = r[x];
      if (y <= 46) { if (c === 'W') r[x] = 'U'; else if (c === 'w') r[x] = 'u'; else if (c === 'B' || c === 'm' || c === 'b') r[x] = 'U'; else if (c === 'G') r[x] = 'S'; }
      else { if (c === 'B' || c === 'm') r[x] = 'J'; else if (c === 'b') r[x] = 'j'; }
      if (y >= 58 && y <= 60 && (c === 'B' || c === 'b')) r[x] = y === 60 ? 'w' : 'X';
    }
    if (y === 38) for (let x = 14; x <= 29; x++) if (r[x] === 'U') r[x] = 'Y';
    rows.push(r);
  }
  if (o.pose === 'up') stampc(rows, FIST, 0, 26);
  for (let x = 17; x <= 21; x++) rows[24][x] = 'K';
  face(rows, e, 24);
  if (kind) { decorHead(rows, kind, e); decorBody(rows, kind, 'teen'); }
  return rows;
}
function teenSprite(o) { return toSprite(teenGrid(o), o.sick); }

/* ================= BAMBINO / NEONATO ================= */
function kidFace(g, expr, o) {
  const set = (x, y, c) => setc(g, x, y, c);
  const ey = o.ey, ex = o.ex, mx = o.mx, my = o.my;
  for (const x0 of ex) {
    if (expr === 'blink' || expr === 'sleep' || expr === 'refuse' || expr === 'yawn') { rectc(g, x0, ey + 1, 3, 1, 'K'); }
    else if (expr === 'happy' || expr === 'grin') { set(x0, ey + 1, 'K'); set(x0 + 1, ey, 'K'); set(x0 + 2, ey + 1, 'K'); }
    else { rectc(g, x0, ey, 3, 3, 'K'); set(x0, ey, 'X'); if (expr === 'sad') { set(x0 + (x0 < 12 ? 0 : 2), ey + 3, 'T'); } }
  }
  const m = (x, y, c) => set(mx + x, my + y, c);
  switch (expr) {
    case 'smile': for (let x = 0; x < 4; x++) m(x, 0, 'K'); m(-1, -1, 'K'); m(4, -1, 'K'); break;
    case 'happy': case 'grin': m(-1, -1, 'K'); m(4, -1, 'K'); m(0, 0, 'K'); m(1, 0, 'X'); m(2, 0, 'X'); m(3, 0, 'K'); for (let x = 0; x < 4; x++) m(x, 1, 'K'); break;
    case 'sad': case 'refuse': for (let x = 0; x < 4; x++) m(x, 0, 'K'); m(-1, 1, 'K'); m(4, 1, 'K'); break;
    case 'talk': m(0, 0, 'K'); m(1, 0, 'M'); m(2, 0, 'M'); m(3, 0, 'K'); for (let x = 0; x < 4; x++) m(x, 1, 'K'); break;
    case 'eat': case 'yawn': for (let y = 0; y < 2; y++) { m(0, y, 'K'); m(1, y, 'M'); m(2, y, 'M'); m(3, y, 'K'); } for (let x = 0; x < 4; x++) m(x, 2, 'K'); break;
    default: for (let x = 0; x < 4; x++) m(x, 0, 'K');
  }
}
function childRaw(o) {
  const w = 24, h = 41, g = blank(w, h);
  const hw = [4, 7, 9, 10, 11, 12, 12, 12, 12, 12, 12, 12, 12, 11, 10, 10, 9, 8];
  hw.forEach((v, r) => { for (let x = 12 - v; x < 12 + v; x++) g[r][x] = 'H'; });
  [[3, 1], [9, 2], [5, 4], [18, 3], [20, 6], [3, 8], [15, 1], [11, 0]].forEach(p => { if (g[p[1]][p[0]] === 'H') g[p[1]][p[0]] = 'K'; });
  for (let r = 8; r <= 21; r++) {
    let l, rr;
    if (r <= 17) { l = 5; rr = 18; } else if (r === 18) { l = 6; rr = 17; } else if (r === 19) { l = 7; rr = 16; } else if (r === 20) { l = 8; rr = 15; } else { l = 9; rr = 14; }
    for (let x = l; x <= rr; x++) g[r][x] = (r === 21) ? 'K' : 'S';
    g[r][l - 1] = 'K'; g[r][rr + 1] = 'K';
  }
  for (let x = 5; x <= 18; x++) g[7][x] = 'K';
  const dep = [2, 3, 3, 2, 3, 2, 2, 3, 3, 2, 3, 3, 2, 2];
  dep.forEach((d, i) => { const x = 5 + i; for (let y = 8; y < 8 + d; y++) g[y][x] = 'H'; g[8 + d][x] = 'K'; });
  setc(g, 6, 17, 'P'); setc(g, 7, 17, 'P'); setc(g, 16, 17, 'P'); setc(g, 17, 17, 'P');
  setc(g, 11, 16, 'K'); setc(g, 12, 16, 'K');
  rectc(g, 6, 12, 4, 1, 'K'); rectc(g, 14, 12, 4, 1, 'K');
